[package]
name = "vantry-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vantry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { version = "3.7", default-features = false }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
env_logger.workspace = true
html5ever = "0.27"
markup5ever_rcdom = "0.3"
nsh-base = { workspace = true, features = ["editor", "rich-editor", "term"] }
nsh-core.workspace = true
qrcodegen = "1.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
vantry-client.workspace = true
vantry-protocol.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true
