name: Release
run-name: Windows release packages for ${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always

# Windows releases are opt-in; normal version tags publish macOS ARM64 only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package for Windows (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag against the workspace version
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Expected v{version} for this checkout, received {tag}")

      - name: Build optimized Windows amd64 binaries
        shell: bash
        run: |
          cargo build --locked --profile release-core --target x86_64-pc-windows-msvc \
            -p vantry-service
          cargo build --locked --profile release-desktop --target x86_64-pc-windows-msvc \
            -p vantry-desktop

      - name: Package Windows desktop and service bundles
        shell: bash
        run: |
          cargo run --locked -p xtask -- package desktop --skip-build \
            --target x86_64-pc-windows-msvc --out-dir dist/desktop
          cargo run --locked -p xtask -- package service --skip-build \
            --target x86_64-pc-windows-msvc --out-dir dist/service
          python scripts/verify_windows_package.py --package dist/desktop/Vantry --skip-installer
          ls -lh dist/desktop dist/service

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: |
            dist/desktop/vantry-*-windows-amd64.zip
            dist/service/vantry-service-*-windows-amd64.zip
            dist/*/*.json
          if-no-files-found: error
