name: Release

env:
  CARGO_TERM_COLOR: always

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build macOS remote-desktop helper (when plugin source provided)
        env:
          VANTRY_REMOTE_PLUGIN_ROOT: ${{ vars.VANTRY_REMOTE_PLUGIN_ROOT }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -n "${VANTRY_REMOTE_PLUGIN_ROOT:-}" ] && [ -d "${VANTRY_REMOTE_PLUGIN_ROOT}" ]; then
            python3 scripts/build_remote_helper.py --platform darwin/arm64 --plugin-root "${VANTRY_REMOTE_PLUGIN_ROOT}"
          elif [ -n "${PRIVATE_REPO_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/muq9738/vantry-plugin-remote-desktop.git" /tmp/vantry-remote-plugin
            python3 scripts/build_remote_helper.py --platform darwin/arm64 --plugin-root /tmp/vantry-remote-plugin
          else
            echo "No remote-desktop plugin source configured; packaging without optional native helper."
          fi

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Package macOS desktop, service and relay bundles
        run: |
          cargo run --locked -p xtask -- package desktop --skip-build --profile release --target aarch64-apple-darwin --out-dir dist/desktop
          cargo run --locked -p xtask -- package service --skip-build --profile release --target aarch64-apple-darwin --out-dir dist/service
          cargo run --locked -p xtask -- package relay --skip-build --profile release --target aarch64-apple-darwin --out-dir dist/relay
          codesign --verify --deep --strict dist/desktop/Vantry.app
          ls -lh dist/desktop dist/service dist/relay

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: |
            dist/desktop/vantry-*-darwin-arm64.zip
            dist/service/vantry-service-*-darwin-arm64.zip
            dist/relay/vantry-relay-*-darwin-arm64.zip
            dist/*/*.json
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build service and relay release binaries
        run: cargo build --release --locked -p vantry-service -p vantry-relay

      - name: Package Linux service and relay bundles
        run: |
          cargo run --locked -p xtask -- package service --skip-build --profile release --target x86_64-unknown-linux-gnu --out-dir dist/service
          cargo run --locked -p xtask -- package relay --skip-build --profile release --target x86_64-unknown-linux-gnu --out-dir dist/relay
          ls -lh dist/service dist/relay

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/service/vantry-service-*-linux-amd64.tar.gz
            dist/relay/vantry-relay-*-linux-amd64.tar.gz
            dist/*/*.json
          if-no-files-found: error

  windows-amd64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release workspace
        shell: bash
        run: cargo build --workspace --release --locked

      - name: Package Windows desktop and service bundles
        shell: bash
        run: |
          cargo run --locked -p xtask -- package desktop --skip-build --profile release --target x86_64-pc-windows-msvc --out-dir dist/desktop
          cargo run --locked -p xtask -- package service --skip-build --profile release --target x86_64-pc-windows-msvc --out-dir dist/service
          python scripts/verify_windows_package.py --package dist/desktop/Vantry --skip-installer
          ls -lh dist/desktop dist/service

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: |
            dist/desktop/vantry-*-windows-amd64.zip
            dist/service/vantry-service-*-windows-amd64.zip
            dist/*/*.json
          if-no-files-found: error

  publish-release:
    needs: [darwin-arm64, linux-x86_64, windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p staging
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.delta' \) -exec mv {} staging/ \;
          cat > release-notes.md <<EOF
          Vantry ${VERSION} full-Rust release (NSH native desktop, Rust Core, embedded Pi worker, standalone relay).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/* --clobber
            gh release edit "$TAG" --title "Vantry ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" staging/* --title "Vantry ${VERSION}" --notes-file release-notes.md --latest
          fi
