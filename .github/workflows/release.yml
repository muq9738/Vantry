name: Release

env:
  CARGO_TERM_COLOR: always

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Package macOS desktop, service and relay bundles
        run: |
          cargo run --locked -p xtask -- package desktop --profile release --target darwin-arm64 --out-dir dist/desktop
          cargo run --locked -p xtask -- package service --profile release --target darwin-arm64 --out-dir dist/service
          cargo run --locked -p xtask -- package relay --profile release --target darwin-arm64 --out-dir dist/relay
          ls -lh dist/desktop dist/service dist/relay

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: |
            dist/desktop/vantry-*-darwin-arm64.zip
            dist/service/vantry-service-*-darwin-arm64.zip
            dist/relay/vantry-relay-*-darwin-arm64.zip
            dist/*/*.json
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build service and relay release binaries
        run: cargo build --release --locked -p vantry-service -p vantry-relay

      - name: Package Linux service and relay bundles
        run: |
          cargo run --locked -p xtask -- package service --profile release --target linux-x86_64 --out-dir dist/service
          cargo run --locked -p xtask -- package relay --profile release --target linux-x86_64 --out-dir dist/relay
          ls -lh dist/service dist/relay

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/service/vantry-service-*-linux-x86_64.tar.gz
            dist/relay/vantry-relay-*-linux-x86_64.tar.gz
            dist/*/*.json
          if-no-files-found: error

  windows-amd64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release workspace
        shell: bash
        run: cargo build --workspace --release --locked

      - name: Package Windows desktop and service bundles
        shell: bash
        run: |
          cargo run --locked -p xtask -- package desktop --profile release --target windows-x86_64 --out-dir dist/desktop
          cargo run --locked -p xtask -- package service --profile release --target windows-x86_64 --out-dir dist/service
          ls -lh dist/desktop dist/service

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: |
            dist/desktop/vantry-*-windows-x86_64.zip
            dist/service/vantry-service-*-windows-x86_64.zip
            dist/*/*.json
          if-no-files-found: error

  publish-release:
    needs: [darwin-arm64, linux-x86_64, windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p staging
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.delta' \) -exec mv {} staging/ \;
          cat > release-notes.md <<EOF
          Vantry ${VERSION} full-Rust release (NSH native desktop, Rust Core, embedded Pi worker, standalone relay).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/* --clobber
            gh release edit "$TAG" --title "Vantry ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" staging/* --title "Vantry ${VERSION}" --notes-file release-notes.md --latest
          fi
