name: Windows Build and Smoke

env:
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/**'
      - 'crates/**'
      - 'tools/**'
      - 'scripts/verify_windows_package.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/**'
      - 'crates/**'
      - 'tools/**'
      - 'scripts/verify_windows_package.py'
      - '.github/workflows/windows.yml'

jobs:
  windows-amd64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Rust workspace tests
        shell: bash
        run: cargo test --workspace --locked

      - name: Build release binaries
        shell: bash
        run: cargo build --workspace --release --locked

      - name: Package Windows desktop bundle
        shell: bash
        run: cargo run --locked -p xtask -- package desktop --profile release --target windows-x86_64 --out-dir dist

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantry-windows-amd64
          path: |
            dist/vantry-*-windows-x86_64.zip
            dist/*.json
