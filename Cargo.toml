[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/client",
    "crates/core",
    "crates/pi-runtime",
    "crates/platform",
    "crates/connectivity",
    "crates/updater",
    "apps/desktop",
    "apps/service",
    "apps/relay",
    "tools/xtask",
]

[workspace.package]
version = "0.2.11"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
vantry-protocol = { path = "crates/protocol" }
vantry-client = { path = "crates/client" }
vantry-core = { path = "crates/core" }
vantry-pi-runtime = { path = "crates/pi-runtime" }
vantry-platform = { path = "crates/platform" }
vantry-connectivity = { path = "crates/connectivity" }
vantry-updater = { path = "crates/updater" }

# Upstream Pi runtime (pinned revision from nsh-core-pi-rust-plan.md)
pi-coding-agent = { git = "https://github.com/yannelli/pi-rust", rev = "f11ea9d" }
pi-agent = { git = "https://github.com/yannelli/pi-rust", rev = "f11ea9d" }
pi-ai = { git = "https://github.com/yannelli/pi-rust", rev = "f11ea9d" }
pi-mcp = { git = "https://github.com/yannelli/pi-rust", rev = "f11ea9d" }

# Upstream NSH UI
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.7.0" }
nsh-base = { git = "https://github.com/longbridge/nsh", tag = "v0.7.0", default-features = false }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", tag = "v0.7.0", default-features = false }
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", tag = "v0.7.0", default-features = false }
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", tag = "v0.7.0", default-features = false }

# Common ecosystem dependencies (aligned with pi-rust & nsh)
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
flate2 = "1.1"
futures = "0.3"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server-auto"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
log = "0.4"
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "7.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release profiles used by the release workflow.  Core keeps a little more
# speed headroom for the embedded Pi runtime while the desktop is optimized
# for the smallest signed application bundle.  Both profiles retain the
# single-codegen-unit and symbol stripping settings from `release`.
[profile.release-core]
inherits = "release"
opt-level = "s"
lto = "fat"

[profile.release-desktop]
inherits = "release"
opt-level = "z"
lto = "fat"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.rquickjs-sys]
opt-level = 2
